# Infra local: PostgreSQL 16 + Redis 7
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: domma, POSTGRES_PASSWORD: domma, POSTGRES_DB: domma_mart }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes: { pg: {} }
